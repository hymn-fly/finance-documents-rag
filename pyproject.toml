[project]
name = "finance-documents-rag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "hwp-hwpx-parser>=1.0.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pdfplumber>=0.11.11",
    "pydantic>=2.14.4",
    "pymupdf>=2.1",
    "pypdf>=7.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
